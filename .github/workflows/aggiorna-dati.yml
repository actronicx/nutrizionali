name: Aggiorna banca dati e pubblica

on:
  schedule:
    # ogni lunedì alle 05:17 UTC (il Repertorio DM è giornaliero, il registro AFMS mensile)
    - cron: "17 5 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["web/**", "etl/**", ".github/workflows/**"]
  # per applicare nuove verifiche basta un push che modifichi etl/verifiche.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r etl/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ricontrolla le fonti delle verifiche
        if: github.event_name != 'push'
        continue-on-error: true
        run: python etl/verifica.py ricontrolla --report web/data/ricontrollo.json

      - name: Scarica e rigenera i dati
        if: github.event_name != 'push'
        run: python etl/update_data.py

      - name: Salva i dati aggiornati nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/products.json web/data/ricontrollo.json
          git diff --cached --quiet || git commit -m "Aggiornamento automatico banca dati $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
